stages:
  - test
  - build
  - deploy

Run tests:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache nodejs pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install
    - pnpm format:check
    - pnpm check
    - pnpm test
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

Build Docker image:
  stage: build
  rules:
    # main → tags sha + latest (déploiement normal)
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      variables:
        EXTRA_TAG: latest
    # autres branches → tags sha + nom-de-branche (jamais latest),
    # utilisable pour déployer une branche via l'override image.tag dans ArgoCD
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      variables:
        EXTRA_TAG: $CI_COMMIT_REF_SLUG
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build
      --build-arg CI_COMMIT_SHA=$CI_COMMIT_SHA
      -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      -t $CI_REGISTRY_IMAGE:$EXTRA_TAG
      .
    - docker push -a $CI_REGISTRY_IMAGE

Trigger ArgoCD sync:
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - 'echo "id len: ${#CLOUDFLARE_AUTH_ID} / secret len: ${#CLOUDFLARE_AUTH_SECRET}"'
    - |
      curl -sSL -o /usr/local/bin/argocd https://$ARGOCD_SERVER/download/argocd-linux-amd64 \
      --header "CF-Access-Client-Id: $CLOUDFLARE_AUTH_ID" \
      --header "CF-Access-Client-Secret: $CLOUDFLARE_AUTH_SECRET"
    - chmod +x /usr/local/bin/argocd
  script:
    - |
      argocd app sync --force --replace "$ARGOCD_APP" \
        --server "$ARGOCD_SERVER" \
        --grpc-web \
        --auth-token "$ARGOCD_AUTH_TOKEN" \
        --header "CF-Access-Client-Id: $CLOUDFLARE_AUTH_ID" \
        --header "CF-Access-Client-Secret: $CLOUDFLARE_AUTH_SECRET"
    - |
      argocd app wait "$ARGOCD_APP" \
        --server "$ARGOCD_SERVER" \
        --grpc-web \
        --auth-token "$ARGOCD_AUTH_TOKEN" \
        --header "CF-Access-Client-Id: $CLOUDFLARE_AUTH_ID" \
        --header "CF-Access-Client-Secret: $CLOUDFLARE_AUTH_SECRET" \
        --health --timeout 300
