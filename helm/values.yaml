# Default values for micropachycephalosaurus.
# Sensitive values (secrets, dockerConfig) are left empty here and supplied at
# deploy time by Argo CD (Application values, a referenced secret manager, etc.).

## @section Image
image:
  registry: registry.gitlab.com
  # Full image path, e.g. <group>/<project>
  repository: cyberpeaceinstitute/micropachycephalosaurus
  tag: latest
  pullPolicy: IfNotPresent

## Reference to the dockerconfigjson secret created by templates/secret-docker.yaml.
## The actual credentials (.Values.dockerConfig) come from the encrypted secrets.yaml.
imagePullSecrets: true

## @section Deployment
## Ignored when autoscaling.enabled is true (the HPA owns the replica count).
replicaCount: 2

## Rolling updates never drop below the desired replica count.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

## @section Autoscaling
## Requires metrics-server on the cluster (present by default on Scaleway Kapsule).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

## PodDisruptionBudget: keep at least one pod during voluntary disruptions
## (node drains, upgrades).
pdb:
  enabled: true
  minAvailable: 1

## Spread replicas across nodes (soft constraint: still schedules if the
## cluster has fewer nodes than replicas).
topologySpread:
  enabled: true

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

## @section Service
service:
  type: ClusterIP
  port: 80
  # Container port the Astro Node server listens on (see Dockerfile EXPOSE/PORT).
  targetPort: 4321

## @section Networking
ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: eclaire.protect.ngo
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: eclaire-protect-ngo-tls
      hosts:
        - eclaire.protect.ngo

## @section Probes
## /healthz is a cheap endpoint (no SSR, no DB): probing / under load would
## time out and make the kubelet kill healthy-but-busy pods.
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

## @section Scheduling
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

## @section Application configuration (non-sensitive)
## These are injected as plain environment variables via a ConfigMap.
config:
  SCW_DB_HOST: ""
  SCW_DB_PORT: ""
  SCW_DB_NAME: ""
  SCW_API_LNK: ""
  SCW_API_LLM_LNK: ""
  N8N_WEBHOOK_URL: ""
  # Max PostgreSQL connections per pod (app default: 10).
  # Keep replicas × pool size well under the instance's max_connections.
  DB_POOL_MAX: ""

## @section Secrets (SENSITIVE — placeholders only)
## DO NOT commit real values here. Set them via the Argo CD Application
## (e.g. spec.source.helm.values / valuesObject, or a secret-management plugin).
## The keys below document the expected shape.
secrets:
  SCW_API_KEY: ""
  SCW_DB_USER: ""
  SCW_DB_PASS: ""
  N8N_WEBHOOK_SECRET: ""

## Base64-encoded .dockerconfigjson for pulling the image from GitLab's registry.
## SENSITIVE — supply via Argo CD, never commit it here.
dockerConfig: ""
